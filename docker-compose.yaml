services:
  ghidra:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      GHIDRA_MCP_PORT: "8089"
      GHIDRA_MCP_AUTH_TOKEN: "${GHIDRA_MCP_AUTH_TOKEN}"
      GHIDRA_MCP_ALLOW_SCRIPTS: "1"
      GHIDRA_MCP_FILE_ROOT: "/artifacts"
      GHIDRA_MCP_PROJECT_ROOT: "/projects"
      GHIDRA_MCP_SCRIPT_ROOT: "/artifacts/scripts"
      GHIDRA_MCP_SCRIPT_CACHE: "/tmp/ghidra-script-cache"
      GHIDRA_MCP_WORKER_COUNT: "5"
      GHIDRA_MCP_WORKER_JAVA_OPTS: "-Xmx1500m -XX:+UseG1GC"
      JAVA_OPTS: "-Xmx1500m -XX:+UseG1GC"
    volumes:
      - ghidra-data:/data
      - ghidra-projects:/projects
      - koba-artifacts:/artifacts
    mem_limit: 10g
    cpus: 6
    pids_limit: 768
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8089/check_connection"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      coolify:
        aliases:
          - ghidra

  bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.bridge
    restart: unless-stopped
    environment:
      GHIDRA_MCP_URL: "http://ghidra:8089/"
      GHIDRA_MCP_WORKER_URLS: "http://ghidra:8089,http://ghidra:8090,http://ghidra:8091,http://ghidra:8092,http://ghidra:8093"
      GHIDRA_MCP_REQUIRE_PROGRAM_SELECTORS: "1"
      GHIDRA_MCP_MAX_CONCURRENT_REQUESTS: "8"
      GHIDRA_MCP_AUTH_TOKEN: "${GHIDRA_MCP_AUTH_TOKEN}"
      GHIDRA_MCP_TRUSTED_HOSTS: "ghidra"
      GHIDRA_MCP_ALLOWED_HOSTS: "ghidra-mcp,bridge,localhost,127.0.0.1"
      GHIDRA_MCP_SESSION_SETTINGS_PATH: "/data/bridge/project_session_settings.json"
    depends_on:
      ghidra:
        condition: service_healthy
    volumes:
      - ghidra-data:/data
    networks:
      coolify:
        aliases:
          - ghidra-mcp

volumes:
  ghidra-data:
  ghidra-projects:
  koba-artifacts:

networks:
  coolify:
    external: true
