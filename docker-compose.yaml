services:
  ghidra:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      GHIDRA_MCP_PORT: "8089"
      GHIDRA_MCP_AUTH_TOKEN: "${GHIDRA_MCP_AUTH_TOKEN}"
      GHIDRA_MCP_ALLOW_SCRIPTS: "1"
      GHIDRA_MCP_FILE_ROOT: "/workspace"
      JAVA_OPTS: "-Xmx4g -XX:+UseG1GC"
    volumes:
      - /srv/ghidra/data:/data
      - /srv/ghidra/anjia-ajl33pq0866-fh8626v100-reverse/projects:/projects/FH8626V100/projects
      - /srv/ghidra/anjia-ajl33pq0866-fh8626v100-reverse/workspace:/workspace/FH8626V100
      - /srv/ghidra/anjia-ajl33pq0866-fh8626v100-reverse/evidence:/workspace/evidence/FH8626V100_REVERSE_EVIDENCE:ro
      - /srv/ghidra/anjia-ajl33pq0866-fh8626v100-reverse/scripts:/home/ubuntu/ghidra_scripts:ro
      - /srv/ghidra/anjia-ajl33pq0866-fh8626v100-reverse/exports:/workspace/exports
      - /srv/ghidra/anjia-ajl33pq0866-fh8626v100-reverse:/home/koba/FH8626V100
      - /srv/ghidra/anjia-ajl33pq0866-fh8626v100-reverse/evidence/corpus/FH8626_STOCK_EVIDENCE_20260828/canonical_v2/runtime_evidence/fh_stock_TELE_NIGHT_TO_TELE_DAY_20260828_R1/TELE_NIGHT_TO_TELE_DAY:/home/koba/FH8626V100/archive/FH8626_REVERSE_HEAVY_v1R3_CANONICAL_20260830/source_vault/target_live/runtime/stock_acquisition_20260828/fh_stock_TELE_NIGHT_TO_TELE_DAY_20260828_R1/TELE_NIGHT_TO_TELE_DAY:ro
    mem_limit: 6g
    cpus: 4
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8089/check_connection"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      coolify:
        aliases:
          - ghidra

  bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.bridge
    restart: unless-stopped
    environment:
      GHIDRA_MCP_URL: "http://ghidra:8089/"
      GHIDRA_MCP_AUTH_TOKEN: "${GHIDRA_MCP_AUTH_TOKEN}"
      GHIDRA_MCP_TRUSTED_HOSTS: "ghidra"
      GHIDRA_MCP_ALLOWED_HOSTS: "ghidra-mcp,bridge,localhost,127.0.0.1"
    depends_on:
      ghidra:
        condition: service_healthy
    networks:
      coolify:
        aliases:
          - ghidra-mcp

networks:
  coolify:
    external: true
