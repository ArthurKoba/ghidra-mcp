services:
  ghidra:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      GHIDRA_MCP_PORT: "8089"
      GHIDRA_MCP_AUTH_TOKEN: "${GHIDRA_MCP_AUTH_TOKEN}"
      GHIDRA_MCP_ALLOW_SCRIPTS: "1"
      GHIDRA_MCP_FILE_ROOT: "/workspace"
      JAVA_OPTS: "-Xmx4g -XX:+UseG1GC"
    volumes:
      - /srv/ghidra/data:/data
      - /srv/ghidra/projects:/projects
      - /srv/ghidra/workspace:/workspace
      - /srv/ghidra/scripts:/workspace/scripts
      - /srv/ghidra/exports:/workspace/exports
    mem_limit: 6g
    cpus: 4
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8089/check_connection"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bridge
    restart: unless-stopped
    environment:
      GHIDRA_MCP_URL: "http://ghidra:8089/"
      GHIDRA_MCP_AUTH_TOKEN: "${GHIDRA_MCP_AUTH_TOKEN}"
      GHIDRA_MCP_ALLOWED_HOSTS: "bridge"
    depends_on:
      ghidra:
        condition: service_healthy

  oauth-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.oauth
    restart: unless-stopped
    environment:
      GHIDRA_MCP_UPSTREAM: "http://bridge:8081/mcp"
      OAUTH_BASE_URL: "${OAUTH_BASE_URL}"
      OAUTH_GITHUB_CLIENT_ID: "${OAUTH_GITHUB_CLIENT_ID}"
      OAUTH_GITHUB_CLIENT_SECRET: "${OAUTH_GITHUB_CLIENT_SECRET}"
      OAUTH_JWT_SIGNING_KEY: "${OAUTH_JWT_SIGNING_KEY}"
      OAUTH_ALLOWED_GITHUB_USERS: "${OAUTH_ALLOWED_GITHUB_USERS:-ArthurKoba}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS}"
      FASTMCP_HOME: "/data/fastmcp"
    volumes:
      - /srv/ghidra/fastmcp:/data/fastmcp
    ports:
      - "192.168.1.5:8093:8000"
    depends_on:
      - bridge
